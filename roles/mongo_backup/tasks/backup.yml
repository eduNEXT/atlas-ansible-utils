# Description: Playbook to launch Mongo backups
# It is compatible with the S3 API and Azure Blob Storage.
---
- name: Check that a database is selected when not backing up all of them
  ansible.builtin.fail:
    msg: |
      MONGO_BACKUP_ALL_DATABASES is false but MONGO_BACKUP_DATABASES is empty, so there is nothing to back up. List the databases to back up in
      MONGO_BACKUP_DATABASES.
  when: not MONGO_BACKUP_ALL_DATABASES and mongo_backup_database_list | length == 0

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ MONGO_BACKUP_LOCATION }}"
    state: directory
    mode: "0755"

- name: Back up every mongo database in a single archive
  ansible.builtin.include_tasks: dump.yml
  vars:
    mongo_backup_database: ""
  when: MONGO_BACKUP_ALL_DATABASES

# mongodump takes a single --db, so each database needs its own run and its own
# archive.
- name: Back up the selected mongo databases
  ansible.builtin.include_tasks: dump.yml
  loop: "{{ mongo_backup_database_list }}"
  loop_control:
    loop_var: mongo_backup_database
  when: not MONGO_BACKUP_ALL_DATABASES
