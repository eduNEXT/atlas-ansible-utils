---
- name: Fail if trying to install on an unsupported distribution
  ansible.builtin.fail:
    msg: MySQL must be installed in a supported distribution
  when: ansible_distribution_release not in MYSQL_8_4_SUPPORTED_DISTRIBUTIONS

- name: Check if MySQL is already installed.
  ansible.builtin.stat:
    path: "{{ mysql_config_file }}"
  register: mysql_installed

- name: Install mysql dependencies
  ansible.builtin.apt:
    name: "{{ mysql_8_4_debian_pkgs }}"
    install_recommends: true
    update_cache: true
    state: present

# apt-key is not available on Ubuntu 26.04, so the key goes to a keyring
# referenced with signed-by in the repo entry.
- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: "{{ MYSQL_8_4_KEYRING_PATH | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add MySQL repository key
  ansible.builtin.get_url:
    url: "{{ MYSQL_8_4_GPG_KEY_URL }}"
    dest: "{{ MYSQL_8_4_KEYRING_PATH }}"
    owner: root
    group: root
    mode: "0644"
  retries: 3
  register: add_mysql_signing_key
  until: add_mysql_signing_key is succeeded

# Hosts provisioned before the keyring change have the same repo without
# signed-by. apt warns about the duplicated entry, so remove the old one.
# Skipped when an inventory still sets MYSQL_8_4_REPO to that same entry.
- name: Remove the legacy MySQL repo entry
  ansible.builtin.apt_repository:
    repo: "{{ mysql_8_4_legacy_repo }}"
    state: absent
    update_cache: false
  when: MYSQL_8_4_REPO != mysql_8_4_legacy_repo

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true

- name: Add MySQL repository to sources list
  ansible.builtin.apt_repository:
    repo: "{{ MYSQL_8_4_REPO }}"
    state: present

# Installing mysql-8.4-client, mysql-8.4-community-server
# and mysql-8.4-server in separate tasks to resolve dependencies
- name: Install mysql-8.4-client
  ansible.builtin.apt:
    name: "{{ mysql_client_8_4_pkg }}"
    state: present
    update_cache: true

- name: Install mysql-8.4-community-server
  ansible.builtin.apt:
    name: "{{ mysql_community_server_8_4_pkg }}"
    state: present
    update_cache: true

- name: Install mysql-8.4-server
  ansible.builtin.apt:
    name: "{{ mysql_server_8_4_pkg }}"
    state: present
    update_cache: true

- name: Ensure MySQL is stopped after initial install.
  ansible.builtin.service:
    name: mysql
    state: restarted
  when: not mysql_installed.stat.exists

- name: Ensure Anonymous user(s) does not exist
  ansible.mysql.mysql_user:
    name: ""
    host: "{{ item }}"
    state: absent
    login_unix_socket: "{{ mysql_8_4_socket }}"
  with_items:
    - localhost
    - "{{ ansible_hostname }}"

- name: Alter user root to use caching_sha2_password
  ansible.builtin.shell: mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password; SET PASSWORD='';"
  become: true
  tags:
    - molecule-idempotence-notest

- name: Post MySQL installation configuration
  ansible.builtin.include_tasks: configure.yml
- name: Create databases
  ansible.builtin.include_tasks: databases.yml
- name: Create users
  ansible.builtin.include_tasks: users.yml
