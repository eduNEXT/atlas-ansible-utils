---
- name: Ensure HAProxy configuration directory exists
  become: true
  ansible.builtin.file:
    path: /etc/haproxy
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags:
    - haproxy
    - config

- name: Ensure the Docker daemon starts on boot
  become: true
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  tags:
    - docker

- name: Pull HAProxy image
  community.docker.docker_image:
    name: "{{ DOCKER_HAPROXY_IMAGE }}"
    source: pull
  register: docker_haproxy_image
  tags:
    - haproxy
    - container

# The configuration is checked with the same image before it is written, so an
# invalid file never reaches the running HAProxy. The temporary file is only
# readable by root, hence --user root.
- name: Render HAProxy configuration
  become: true
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    validate: >-
      docker run --rm --user root --network host
      --volume %s:/usr/local/etc/haproxy/haproxy.cfg:ro
      {{ DOCKER_HAPROXY_IMAGE }} haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
  tags:
    - haproxy
    - config
  notify:
    - Reload HAProxy

- name: Render HAProxy systemd unit
  become: true
  ansible.builtin.template:
    src: haproxy.service.j2
    dest: /etc/systemd/system/haproxy.service
    owner: root
    group: root
    mode: "0644"
  register: docker_haproxy_unit
  tags:
    - haproxy
    - container

# Any existing container named haproxy is removed by the unit (ExecStartPre)
# before the service starts its own. A new image or unit requires a new
# container, so both cause a restart; a reload keeps the running container.
- name: Start HAProxy service
  become: true
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true
    daemon_reload: "{{ docker_haproxy_unit is changed }}"
    state: "{{ 'restarted' if docker_haproxy_unit is changed or docker_haproxy_image is changed else 'started' }}"
  register: docker_haproxy_service
  tags:
    - haproxy
    - container
