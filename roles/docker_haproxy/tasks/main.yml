---
- name: Check HAProxy configuration directory
  ansible.builtin.stat:
    path: /etc/haproxy
  register: docker_haproxy_config_dir
  tags:
    - haproxy
    - config

# Only created when missing, so an existing directory keeps its ownership and permissions.
- name: Create HAProxy configuration directory
  become: true
  ansible.builtin.file:
    path: /etc/haproxy
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: not docker_haproxy_config_dir.stat.exists
  tags:
    - haproxy
    - config

- name: Render HAProxy configuration
  become: true
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  tags:
    - haproxy
    - config
  notify:
    - Restart HAProxy Container

- name: Configure HAProxy Network
  community.docker.docker_network:
    name: "{{ DOCKER_HAPROXY_NETWORK }}"
  tags:
    - docker
    - network

- name: Start HAProxy Container
  community.docker.docker_container:
    name: haproxy
    image: "{{ DOCKER_HAPROXY_IMAGE }}"
    restart_policy: unless-stopped
    networks:
      - name: "{{ DOCKER_HAPROXY_NETWORK }}"
    state: started
    published_ports: >-
      {{
        [
          DOCKER_HAPROXY_BIND_ADDRESS ~ ':80:80',
          DOCKER_HAPROXY_BIND_ADDRESS ~ ':443:443',
        ]
        + (
          [DOCKER_HAPROXY_BIND_ADDRESS ~ ':' ~ DOCKER_HAPROXY_K8S_API_PORT ~ ':' ~ DOCKER_HAPROXY_K8S_API_PORT]
          if DOCKER_HAPROXY_K8S_API_ENABLED | bool else []
        )
      }}
    mounts:
      - source: /etc/haproxy/
        target: /usr/local/etc/haproxy
        type: bind
  tags:
    - haproxy
    - container
