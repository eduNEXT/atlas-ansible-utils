---
CLICKHOUSE_BACKUP_STORAGE_TYPE: local
CLICKHOUSE_BACKUP_DATABASES: []
CLICKHOUSE_BACKUP_PATH: /mnt/backups
CLICKHOUSE_BACKUP_FILE_PREFIX: clickhouse
CLICKHOUSE_BACKUP_TIMESTAMP: "{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
CLICKHOUSE_BACKUP_USER_NAME: "{{ CLICKHOUSE_DEFAULT_USER_NAME | default('default') }}"
CLICKHOUSE_BACKUP_USER_PASSWORD: "{{ CLICKHOUSE_DEFAULT_USER_PASSWORD | default('') }}"
CLICKHOUSE_BACKUP_NATIVE_PORT: 9000
CLICKHOUSE_BACKUP_CONFIG_FILE: /etc/clickhouse-server/config.d/50-backups.xml
CLICKHOUSE_BACKUP_S3_BUCKET_NAME: ""
CLICKHOUSE_BACKUP_S3_REGION: us-west-2
CLICKHOUSE_BACKUP_S3_PREFIX: newtest
CLICKHOUSE_BACKUP_S3_ENDPOINT: ""
CLICKHOUSE_BACKUP_S3_ACCESS_KEY_ID: ""
CLICKHOUSE_BACKUP_S3_SECRET_ACCESS_KEY: ""
CLICKHOUSE_BACKUP_S3_CONFIG_FILE: /etc/clickhouse-server/config.d/60-backup-s3.xml
