---
- name: Validate ClickHouse backup settings
  ansible.builtin.assert:
    that:
      - CLICKHOUSE_BACKUP_STORAGE_TYPE in ['local', 's3']
      - CLICKHOUSE_BACKUP_PATH is match('^/')
      - CLICKHOUSE_BACKUP_PATH is not search("'")
      - CLICKHOUSE_BACKUP_FILE_PREFIX is match('^[A-Za-z0-9_.-]+$')
      - CLICKHOUSE_BACKUP_DATABASES | select('match', '^[A-Za-z0-9_]+$') | list | length == CLICKHOUSE_BACKUP_DATABASES | length
      - CLICKHOUSE_BACKUP_USER_NAME | length > 0
      - CLICKHOUSE_BACKUP_USER_PASSWORD | length > 0
    fail_msg: ClickHouse backup settings are incomplete or contain unsupported characters.
    quiet: true
  tags:
    - clickhouse_backup

- name: Validate ClickHouse S3 backup settings
  ansible.builtin.assert:
    that:
      - CLICKHOUSE_BACKUP_S3_BUCKET_NAME | length > 0
      - CLICKHOUSE_BACKUP_S3_REGION | length > 0
      - CLICKHOUSE_BACKUP_S3_PREFIX is match('^[A-Za-z0-9][A-Za-z0-9_./-]*$')
      - not CLICKHOUSE_BACKUP_S3_PREFIX.endswith('/')
      - (CLICKHOUSE_BACKUP_S3_ACCESS_KEY_ID | length == 0) == (CLICKHOUSE_BACKUP_S3_SECRET_ACCESS_KEY | length == 0)
      - CLICKHOUSE_BACKUP_S3_ENDPOINT | length == 0 or CLICKHOUSE_BACKUP_S3_ENDPOINT is match('^https://')
      - CLICKHOUSE_BACKUP_S3_ENDPOINT | length == 0 or CLICKHOUSE_BACKUP_S3_ENDPOINT.endswith('/')
    fail_msg: S3 backup settings are incomplete or the AWS credentials are only partially configured.
    quiet: true
  when: CLICKHOUSE_BACKUP_STORAGE_TYPE == 's3'
  tags:
    - clickhouse_backup

- name: Create the local ClickHouse backup directory
  ansible.builtin.file:
    path: "{{ CLICKHOUSE_BACKUP_PATH }}"
    state: directory
    owner: clickhouse
    group: clickhouse
    mode: "0750"
  when: CLICKHOUSE_BACKUP_STORAGE_TYPE == 'local'
  tags:
    - clickhouse_backup

- name: Install the ClickHouse Python driver
  ansible.builtin.apt:
    name: python3-clickhouse-driver
    state: present
    update_cache: true
  tags:
    - clickhouse_backup

- name: Generate a unique ClickHouse S3 backup identifier
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import uuid; print(uuid.uuid4())
  register: clickhouse_backup_run_id
  changed_when: false
  when: CLICKHOUSE_BACKUP_STORAGE_TYPE == 's3'
  tags:
    - clickhouse_backup

- name: Configure the allowed ClickHouse backup path
  ansible.builtin.template:
    src: backups.xml.j2
    dest: "{{ CLICKHOUSE_BACKUP_CONFIG_FILE }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ClickHouse for backup configuration
  when: CLICKHOUSE_BACKUP_STORAGE_TYPE == 'local'
  tags:
    - clickhouse_backup

- name: Configure the ClickHouse S3 backup collection
  ansible.builtin.template:
    src: s3-backups.xml.j2
    dest: "{{ CLICKHOUSE_BACKUP_S3_CONFIG_FILE }}"
    owner: root
    group: clickhouse
    mode: "0640"
  no_log: true
  notify: Restart ClickHouse for backup configuration
  when: CLICKHOUSE_BACKUP_STORAGE_TYPE == 's3'
  tags:
    - clickhouse_backup

- name: Remove the inactive ClickHouse backup configuration
  ansible.builtin.file:
    path: "{{ CLICKHOUSE_BACKUP_CONFIG_FILE if CLICKHOUSE_BACKUP_STORAGE_TYPE == 's3' else CLICKHOUSE_BACKUP_S3_CONFIG_FILE }}"
    state: absent
  notify: Restart ClickHouse for backup configuration
  tags:
    - clickhouse_backup

- name: Apply ClickHouse backup configuration
  ansible.builtin.meta: flush_handlers
  tags:
    - clickhouse_backup

- name: Back up all databases to the local path
  community.clickhouse.clickhouse_client:
    execute: >-
      BACKUP ALL TO File('{{ CLICKHOUSE_BACKUP_PATH }}/{{ CLICKHOUSE_BACKUP_FILE_PREFIX }}_all_{{ CLICKHOUSE_BACKUP_TIMESTAMP }}.zip')
    login_host: localhost
    login_port: "{{ CLICKHOUSE_BACKUP_NATIVE_PORT }}"
    login_user: "{{ CLICKHOUSE_BACKUP_USER_NAME }}"
    login_password: "{{ CLICKHOUSE_BACKUP_USER_PASSWORD }}"
  when:
    - CLICKHOUSE_BACKUP_STORAGE_TYPE == 'local'
    - CLICKHOUSE_BACKUP_DATABASES | length == 0
  no_log: true
  tags:
    - clickhouse_backup

- name: Back up all databases to S3
  community.clickhouse.clickhouse_client:
    execute: "BACKUP ALL TO S3(clickhouse_backup_s3, '{{ clickhouse_backup_s3_object_path }}')"
    login_host: localhost
    login_port: "{{ CLICKHOUSE_BACKUP_NATIVE_PORT }}"
    login_user: "{{ CLICKHOUSE_BACKUP_USER_NAME }}"
    login_password: "{{ CLICKHOUSE_BACKUP_USER_PASSWORD }}"
  vars:
    clickhouse_backup_s3_object_path: "{{ CLICKHOUSE_BACKUP_S3_PREFIX }}/{{ CLICKHOUSE_BACKUP_FILE_PREFIX }}_{{ inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_') }}_all_{{ CLICKHOUSE_BACKUP_TIMESTAMP }}_{{ clickhouse_backup_run_id.stdout | default('') }}" # noqa yaml[line-length]
  when:
    - CLICKHOUSE_BACKUP_STORAGE_TYPE == 's3'
    - CLICKHOUSE_BACKUP_DATABASES | length == 0
  no_log: true
  tags:
    - clickhouse_backup

- name: Back up each configured database to the local path
  community.clickhouse.clickhouse_client:
    execute: >-
      BACKUP DATABASE `{{ item }}` TO File('{{ CLICKHOUSE_BACKUP_PATH }}/{{ CLICKHOUSE_BACKUP_FILE_PREFIX }}_{{ item }}_{{ CLICKHOUSE_BACKUP_TIMESTAMP }}.zip')
    login_host: localhost
    login_port: "{{ CLICKHOUSE_BACKUP_NATIVE_PORT }}"
    login_user: "{{ CLICKHOUSE_BACKUP_USER_NAME }}"
    login_password: "{{ CLICKHOUSE_BACKUP_USER_PASSWORD }}"
  loop: "{{ CLICKHOUSE_BACKUP_DATABASES }}"
  loop_control:
    label: "{{ item }}"
  when:
    - CLICKHOUSE_BACKUP_STORAGE_TYPE == 'local'
    - CLICKHOUSE_BACKUP_DATABASES | length > 0
  no_log: true
  tags:
    - clickhouse_backup

- name: Back up each configured database to S3
  community.clickhouse.clickhouse_client:
    execute: "BACKUP DATABASE `{{ item }}` TO S3(clickhouse_backup_s3, '{{ clickhouse_backup_s3_object_path }}')"
    login_host: localhost
    login_port: "{{ CLICKHOUSE_BACKUP_NATIVE_PORT }}"
    login_user: "{{ CLICKHOUSE_BACKUP_USER_NAME }}"
    login_password: "{{ CLICKHOUSE_BACKUP_USER_PASSWORD }}"
  loop: "{{ CLICKHOUSE_BACKUP_DATABASES }}"
  loop_control:
    label: "{{ item }}"
  vars:
    clickhouse_backup_s3_object_path: "{{ CLICKHOUSE_BACKUP_S3_PREFIX }}/{{ CLICKHOUSE_BACKUP_FILE_PREFIX }}_{{ inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_') }}_{{ item }}_{{ CLICKHOUSE_BACKUP_TIMESTAMP }}_{{ clickhouse_backup_run_id.stdout | default('') }}" # noqa yaml[line-length]
  when:
    - CLICKHOUSE_BACKUP_STORAGE_TYPE == 's3'
    - CLICKHOUSE_BACKUP_DATABASES | length > 0
  no_log: true
  tags:
    - clickhouse_backup
