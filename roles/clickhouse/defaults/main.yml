---
CLICKHOUSE_VERSION: "25.8"
CLICKHOUSE_ALLOW_MAJOR_UPGRADE: false

CLICKHOUSE_VOLUMES: []
CLICKHOUSE_DEFAULT_USER_PASSWORD: "{{ vault_clickhouse_default_password | default('changeme123') }}"
CLICKHOUSE_ADMIN_USER: "default"
CLICKHOUSE_ADMIN_PASSWORD: "{{ vault_clickhouse_admin_password | default('') }}"

CLICKHOUSE_PACKAGES:
  - clickhouse-client
  - clickhouse-server
  - clickhouse-common-static

CLICKHOUSE_USERS:
  - name: prod
    password: prod
  - name: stage
    password: stage

CLICKHOUSE_LISTEN_HOSTS:
  - "::"
  - 0.0.0.0

CLICKHOUSE_HOST_INSECURE_HTTP_PORT: 8123
CLICKHOUSE_INTERNAL_INSECURE_NATIVE_PORT: 9000

CLICKHOUSE_GPG_KEY_URL: https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key
CLICKHOUSE_KEYRING_PATH: /usr/share/keyrings/clickhouse-keyring.gpg
CLICKHOUSE_REPO: "deb [signed-by={{ CLICKHOUSE_KEYRING_PATH }} arch=amd64] https://packages.clickhouse.com/deb stable main"

# System Logs
CLICKHOUSE_LOG_LEVEL: warning
CLICKHOUSE_SYSTEM_LOGS_ENABLED: false
CLICKHOUSE_SYSTEM_LOG_TABLES:
  - name: trace_log
    retention_days: 7
  - name: text_log
    retention_days: 7
  - name: metric_log
    retention_days: 7
  - name: asynchronous_metric_log
    retention_days: 7
  - name: query_metric_log
    retention_days: 7
  - name: query_thread_log
    retention_days: 7
  - name: part_log
    retention_days: 7
  - name: query_log
    retention_days: 14

# Backup Disk
CLICKHOUSE_BACKUP_DISK_NAME: backups
CLICKHOUSE_BACKUP_ROOT: /backups/clickhouse
CLICKHOUSE_BACKUP_ENABLED: false