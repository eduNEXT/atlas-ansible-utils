---
- name: Install ClickHouse dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - dirmngr
      - gpg-agent
    state: present
    update_cache: true

- name: Add ClickHouse GPG key
  ansible.builtin.apt_key:
    url: "{{ CLICKHOUSE_GPG_KEY_URL }}"
    keyring: "{{ CLICKHOUSE_KEYRING_PATH }}"
    state: present

- name: Add ClickHouse repository
  ansible.builtin.apt_repository:
    repo: "{{ CLICKHOUSE_REPO }}"
    filename: clickhouse
    state: present
    update_cache: true

- name: Install ClickHouse
  ansible.builtin.apt:
    name: "{{ CLICKHOUSE_PACKAGES | map('regex_replace', '$', '=' + CLICKHOUSE_VERSION) | list }}"
    state: present
    update_cache: true
  become: true
  notify: Restart clickhouse

- name: Create /etc/clickhouse-server/config.d/host.xml
  ansible.builtin.template:
    src: host.xml.j2
    dest: /etc/clickhouse-server/config.d/host.xml
    mode: preserve
  notify: Restart clickhouse

- name: Configure bootstrap users before starting ClickHouse
  ansible.builtin.template:
    src: users.xml.j2
    dest: /etc/clickhouse-server/users.xml
    mode: preserve
  notify: Restart clickhouse

- name: Configure backup disk
  ansible.builtin.template:
    src: backup_disk.xml.j2
    dest: /etc/clickhouse-server/config.d/backup_disk.xml
    mode: preserve
  notify: Restart clickhouse

- name: Configure system log retention, enablement and verbosity
  ansible.builtin.template:
    src: system_logs.xml.j2
    dest: /etc/clickhouse-server/config.d/system_logs.xml
    mode: preserve
  notify: Restart clickhouse

- name: Restart clickhouse service
  ansible.builtin.service:
    name: clickhouse-server
    state: restarted
    enabled: true

- name: Wait for authenticated bootstrap access
  ansible.builtin.command:
    argv:
      - clickhouse-client
      - --port
      - "{{ CLICKHOUSE_INTERNAL_INSECURE_NATIVE_PORT | string }}"
      - --user
      - default
      - "--password={{ CLICKHOUSE_DEFAULT_USER_PASSWORD }}"
    stdin: SELECT 1
  register: ch_bootstrap_ready
  until: ch_bootstrap_ready.rc == 0 and ch_bootstrap_ready.stdout | trim == '1'
  retries: 30
  delay: 2
  changed_when: false
  no_log: true

- name: Verify admin access after final configuration
  ansible.builtin.command:
    argv:
      - clickhouse-client
      - --port
      - "{{ CLICKHOUSE_INTERNAL_INSECURE_NATIVE_PORT | string }}"
      - --user
      - default
      - "--password={{ CLICKHOUSE_DEFAULT_USER_PASSWORD }}"
    stdin: SELECT 1
  register: ch_admin_ready
  until: ch_admin_ready.rc == 0 and ch_admin_ready.stdout | trim == '1'
  retries: 30
  delay: 2
  changed_when: false
  no_log: true