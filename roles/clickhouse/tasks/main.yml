---
- name: Validate the ClickHouse administrator password
  ansible.builtin.assert:
    that:
      - CLICKHOUSE_DEFAULT_USER_PASSWORD | trim | length > 7
    fail_msg: CLICKHOUSE_DEFAULT_USER_PASSWORD must contain at least 8 characters and cannot be whitespace-only.
    quiet: true
  tags:
    - always

- name: Install ClickHouse dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - dirmngr
      - gpg-agent
      - python3-debian
      - python3-clickhouse-driver
    state: present
    update_cache: true
  tags:
    - clickhouse_install

- name: Remove the legacy ClickHouse repo file
  ansible.builtin.file:
    path: "{{ clickhouse_legacy_repo_file }}"
    state: absent
  tags:
    - clickhouse_install

- name: Add ClickHouse repository
  ansible.builtin.deb822_repository:
    name: clickhouse
    types: deb
    uris: "{{ CLICKHOUSE_REPO_URI }}"
    suites: "{{ CLICKHOUSE_REPO_SUITE }}"
    components: "{{ CLICKHOUSE_REPO_COMPONENTS }}"
    architectures: amd64
    signed_by: "{{ CLICKHOUSE_GPG_KEY_URL }}"
  tags:
    - clickhouse_install

- name: Install ClickHouse
  ansible.builtin.apt:
    name: "{{ CLICKHOUSE_PACKAGES | map('regex_replace', '$', '=' + CLICKHOUSE_VERSION) | list }}"
    state: present
    update_cache: true
  become: true
  tags:
    - clickhouse_install

- name: Create Hosts configuration file
  ansible.builtin.template:
    src: host.xml.j2
    dest: /etc/clickhouse-server/config.d/10-host.xml
    mode: preserve
  tags:
    - clickhouse_configure

- name: Create logging configuration file
  ansible.builtin.template:
    src: logging.xml.j2
    dest: /etc/clickhouse-server/config.d/20-logging.xml
    mode: preserve
  tags:
    - clickhouse_configure

- name: Create overrides configuration file
  ansible.builtin.template:
    src: server-override.xml.j2
    dest: /etc/clickhouse-server/config.d/99-server-override.xml
    mode: preserve
  tags:
    - clickhouse_configure

- name: Configure the admin user
  ansible.builtin.template:
    src: users.xml.j2
    dest: /etc/clickhouse-server/users.d/00-admin-user.xml
    mode: preserve
  tags:
    - clickhouse_configure
    - clickhouse_users

- name: Start clickhouse service
  ansible.builtin.service:
    name: clickhouse-server
    state: started
    enabled: true
  tags:
    - clickhouse_configure
    - clickhouse_users

- name: Create ClickHouse roles
  community.clickhouse.clickhouse_role:
    name: "{{ item.role }}"
    state: present
    login_host: localhost
    login_port: "{{ CLICKHOUSE_INTERNAL_INSECURE_NATIVE_PORT }}"
    login_user: "{{ CLICKHOUSE_DEFAULT_USER_NAME }}"
    login_password: "{{ CLICKHOUSE_DEFAULT_USER_PASSWORD | default(omit, true) }}"
  loop: "{{ CLICKHOUSE_USERS }}"
  loop_control:
    label: "{{ item | ansible.utils.remove_keys(target=['password']) }}"
  tags:
    - clickhouse_users

- name: Grant permissions to roles
  community.clickhouse.clickhouse_grants:
    exclusive: true
    grantee: "{{ item.role }}"
    privileges: "{{ item.permissions }}"
    state: present
    login_host: localhost
    login_port: "{{ CLICKHOUSE_INTERNAL_INSECURE_NATIVE_PORT }}"
    login_user: "{{ CLICKHOUSE_DEFAULT_USER_NAME }}"
    login_password: "{{ CLICKHOUSE_DEFAULT_USER_PASSWORD | default(omit, true) }}"
  loop: "{{ CLICKHOUSE_USERS }}"
  loop_control:
    label: "{{ item | ansible.utils.remove_keys(target=['password']) }}"
  when: item.permissions | default([]) | length > 0
  tags:
    - clickhouse_users

- name: Create users and bind to the roles
  community.clickhouse.clickhouse_user:
    name: "{{ item.name }}"
    authentication:
      type: plaintext_password
      password: "{{ item.password }}"
    roles:
      - "{{ item.role }}"
    roles_mode: append
    update_password: on_create
    user_hosts:
      - type: ANY
    state: present
    login_host: localhost
    login_port: "{{ CLICKHOUSE_INTERNAL_INSECURE_NATIVE_PORT }}"
    login_user: "{{ CLICKHOUSE_DEFAULT_USER_NAME }}"
    login_password: "{{ CLICKHOUSE_DEFAULT_USER_PASSWORD | default(omit, true) }}"
  loop: "{{ CLICKHOUSE_USERS }}"
  loop_control:
    label: "{{ item | ansible.utils.remove_keys(target=['password']) }}"
  tags:
    - clickhouse_users
