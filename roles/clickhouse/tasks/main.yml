---
- name: Validate ClickHouse configuration
  ansible.builtin.assert:
    that:
      - CLICKHOUSE_VERSION is match('^\d+\.\d+$')
      - CLICKHOUSE_BACKUP_ROOT is defined and CLICKHOUSE_BACKUP_ROOT != ""
      - CLICKHOUSE_DEFAULT_USER_PASSWORD | length >= 12
      - CLICKHOUSE_LISTEN_HOSTS | type_debug == 'list'
      - CLICKHOUSE_SYSTEM_LOG_TABLES | type_debug == 'list'
      - CLICKHOUSE_LOG_LEVEL in ['trace', 'debug', 'information', 'warning', 'error', 'fatal']
      - CLICKHOUSE_ADMIN_USER is defined
      - (CLICKHOUSE_ADMIN_USER == 'default') or (CLICKHOUSE_ADMIN_PASSWORD | length >= 12)
    fail_msg: "Invalid ClickHouse config"
    quiet: true
  tags: [validate, clickhouse]

- name: Mount ClickHouse volumes
  ansible.builtin.include_role:
    name: mount_ebs
  vars:
    volumes: "{{ CLICKHOUSE_VOLUMES }}"
  when: CLICKHOUSE_VOLUMES | length > 0
  tags: [storage, clickhouse, mount]

- name: Install ClickHouse dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - dirmngr
      - gpg-agent
    state: present
    update_cache: true
  tags: [install, clickhouse, packages]

- name: Add ClickHouse GPG key
  ansible.builtin.apt_key:
    url: "{{ CLICKHOUSE_GPG_KEY_URL }}"
    keyring: "{{ CLICKHOUSE_KEYRING_PATH }}"
    state: present
  tags: [install, clickhouse, packages]

- name: Add ClickHouse repository
  ansible.builtin.apt_repository:
    repo: "{{ CLICKHOUSE_REPO }}"
    filename: clickhouse
    state: present
    update_cache: true
  tags: [install, clickhouse, packages]

- name: Get installed ClickHouse version
  ansible.builtin.command: clickhouse-server --version
  register: ch_installed_version
  changed_when: false
  failed_when: false
  tags: [upgrade, clickhouse, packages]

- name: Parse installed version components
  ansible.builtin.set_fact:
    ch_installed_major: "{{ ch_installed_version.stdout | regex_search('^(\\d+)\\.(\\d+)', '\\1') | first | default('0') }}"
    ch_installed_minor: "{{ ch_installed_version.stdout | regex_search('^(\\d+)\\.(\\d+)', '\\2') | first | default('0') }}"
    ch_desired_major: "{{ CLICKHOUSE_VERSION.split('.')[0] }}"
    ch_desired_minor: "{{ CLICKHOUSE_VERSION.split('.')[1] }}"
  tags: [upgrade, clickhouse, packages]

- name: Validate upgrade safety
  ansible.builtin.assert:
    that:
      - not (ch_installed_major != ch_desired_major and not CLICKHOUSE_ALLOW_MAJOR_UPGRADE)
    fail_msg: |
      Major version upgrade detected ({{ ch_installed_major }} -> {{ ch_desired_major }}).
      Set CLICKHOUSE_ALLOW_MAJOR_UPGRADE=true and run backup manually first.
  tags: [upgrade, clickhouse, packages]

- name: Upgrade ClickHouse packages (patch/minor only)
  ansible.builtin.apt:
    name: "{{ CLICKHOUSE_PACKAGES | map('regex_replace', '$', '=' + CLICKHOUSE_VERSION + '*') | list }}"
    state: present
    update_cache: true
    policy_rc_d: 101
  when:
    - ch_installed_major == ch_desired_major
    - ch_installed_minor != ch_desired_minor
  notify: clickhouse restart
  tags: [upgrade, clickhouse, packages]

- name: Install ClickHouse
  ansible.builtin.apt:
    name: "{{ CLICKHOUSE_PACKAGES | map('regex_replace', '$', '=' + CLICKHOUSE_VERSION + '*') | list }}"
    state: present
    update_cache: true
    policy_rc_d: 101
  become: true
  notify: clickhouse restart
  tags: [install, clickhouse, packages]

- name: Determine admin user and password
  ansible.builtin.set_fact:
    ch_admin_user: "{{ CLICKHOUSE_ADMIN_USER }}"
    ch_is_custom_admin: "{{ CLICKHOUSE_ADMIN_USER != 'default' }}"
    ch_admin_password: "{{ CLICKHOUSE_ADMIN_PASSWORD if CLICKHOUSE_ADMIN_USER != 'default' else CLICKHOUSE_DEFAULT_USER_PASSWORD }}"
  no_log: true
  tags: [configure, clickhouse, bootstrap]

- name: Check whether default user was retired by a previous run
  ansible.builtin.stat:
    path: /etc/clickhouse-server/users.d/remove_default_user.yaml
  register: default_user_removed
  tags: [configure, clickhouse, bootstrap]

- name: Deploy ClickHouse configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: preserve
  loop:
    - { src: 'host.xml.j2', dest: '/etc/clickhouse-server/config.d/host.xml', notify: 'clickhouse restart' }
    - { src: 'users.xml.j2', dest: '/etc/clickhouse-server/users.xml', notify: 'clickhouse reload users' }
    - { src: 'system_logs.xml.j2', dest: '/etc/clickhouse-server/config.d/system_logs.xml', notify: 'clickhouse reload config' }
    - { src: 'backup_disk.xml.j2', dest: '/etc/clickhouse-server/config.d/backup_disk.xml', notify: 'clickhouse restart' }
  notify: "{{ item.notify }}"
  tags: [configure, clickhouse, config]

- name: Deploy custom ClickHouse configs
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "/etc/clickhouse-server/config.d/{{ item.key }}"
    mode: '0644'
  loop: "{{ CLICKHOUSE_CUSTOM_CONFIGS | dict2items }}"
  notify: clickhouse reload config
  when: CLICKHOUSE_CUSTOM_CONFIGS | length > 0
  tags: [configure, clickhouse, config]

- name: Apply pending ClickHouse configuration changes
  ansible.builtin.meta: flush_handlers
  tags: [configure, clickhouse, config]

- name: Start clickhouse service
  ansible.builtin.service:
    name: clickhouse-server
    state: started
    enabled: true
  tags: [bootstrap, clickhouse, service]

- name: Create custom admin user
  when: ch_is_custom_admin | bool
  no_log: true
  ansible.builtin.shell: |
    clickhouse-client --port {{ CLICKHOUSE_INTERNAL_INSECURE_NATIVE_PORT }} --user "default" --password="{{ CLICKHOUSE_DEFAULT_USER_PASSWORD }}" --multiquery <<'EOF'
    CREATE USER IF NOT EXISTS {{ CLICKHOUSE_ADMIN_USER }} IDENTIFIED WITH sha256_password BY '{{ CLICKHOUSE_ADMIN_PASSWORD }}';
    GRANT ALL ON *.* TO {{ CLICKHOUSE_ADMIN_USER }} WITH GRANT OPTION;
    EOF
  tags: [bootstrap, clickhouse, users]

- name: Wait for ClickHouse and verify admin access (SINGLE VERIFICATION)
  ansible.builtin.command:
    argv:
      - clickhouse-client
      - --port
      - "{{ CLICKHOUSE_INTERNAL_INSECURE_NATIVE_PORT | string }}"
      - --user
      - "{{ ch_admin_user }}"
      - "--password={{ ch_admin_password }}"
    stdin: SELECT 1
  register: ch_admin_ready
  until: ch_admin_ready.rc == 0 and ch_admin_ready.stdout | trim == '1'
  retries: 30
  delay: 2
  changed_when: false
  no_log: true
  tags: [bootstrap, clickhouse, verify]

- name: Create SQL Roles, Users and grant permissions
  loop: "{{ CLICKHOUSE_USERS }}"
  no_log: true
  register: clickhouse_client
  tags:
    - bootstrap
    - clickhouse
    - users
    - molecule-idempotence-notest
  vars:
    active_user: "{{ ch_admin_user }}"
    active_password: "{{ ch_admin_password }}"
  ansible.builtin.shell: |
    clickhouse-client --port {{ CLICKHOUSE_INTERNAL_INSECURE_NATIVE_PORT }} --user "{{ active_user }}" --password="{{ active_password }}" --multiquery <<'EOF'

    CREATE ROLE IF NOT EXISTS '{{ item.name }}_admin';

    GRANT ALL ON system.* TO '{{ item.name }}_admin' WITH GRANT OPTION;
    GRANT ALL ON {{ item.name }}_xapi.* TO '{{ item.name }}_admin' WITH GRANT OPTION;
    GRANT ALL ON {{ item.name }}_xapi_events_all.* TO '{{ item.name }}_admin' WITH GRANT OPTION;
    GRANT ALL ON {{ item.name }}_reporting.* TO '{{ item.name }}_admin' WITH GRANT OPTION;
    GRANT ALL ON {{ item.name }}_event_sink.* TO '{{ item.name }}_admin' WITH GRANT OPTION;
    GRANT ALL ON {{ item.name }}_vector.* TO '{{ item.name }}_admin' WITH GRANT OPTION;
    GRANT ALL ON openedx.* TO '{{ item.name }}_admin' WITH GRANT OPTION;
    GRANT ALL ON reporting.* TO '{{ item.name }}_admin' WITH GRANT OPTION;
    GRANT ALL ON xapi.* TO '{{ item.name }}_admin' WITH GRANT OPTION;
    GRANT ALL ON event_sink.* TO '{{ item.name }}_admin' WITH GRANT OPTION;
    GRANT CREATE USER ON *.* to '{{ item.name }}_admin';
    GRANT ALTER USER ON *.* to '{{ item.name }}_admin';
    GRANT DROP FUNCTION ON *.* to '{{ item.name }}_admin';
    GRANT CREATE FUNCTION ON *.* to '{{ item.name }}_admin';

    CREATE USER IF NOT EXISTS {{ item.name }} identified with plaintext_password by '{{ item.password }}';

    GRANT {{ item.name }}_admin to {{ item.name }};

    EOF

- name: Remove default user configuration
  when: ch_is_custom_admin | bool
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/users.d/remove_default_user.yaml
    content: |
      users:
        default:
          "@remove": remove
    mode: '0644'
  notify: clickhouse reload users
  tags: [bootstrap, clickhouse, users]

- name: Apply default user retirement
  when: ch_is_custom_admin | bool
  ansible.builtin.meta: flush_handlers
  tags: [bootstrap, clickhouse, users]

- name: Include clickhouse_backup role for backup policies
  ansible.builtin.include_role:
    name: clickhouse_backup
  vars:
    clickhouse_backup_disk: "{{ CLICKHOUSE_BACKUP_DISK_NAME }}"
    clickhouse_backup_root: "{{ CLICKHOUSE_BACKUP_ROOT }}"
  when: CLICKHOUSE_BACKUP_ENABLED | bool
  tags: [backup, clickhouse]