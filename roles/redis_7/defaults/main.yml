---
#
# edX Configuration
#
# github:     https://github.com/openedx/configuration
# wiki:       https://openedx.atlassian.net/wiki/display/OpenOPS
# code style: https://openedx.atlassian.net/wiki/display/OpenOPS/Ansible+Code+Conventions
# license:    https://github.com/openedx/configuration/blob/master/LICENSE.TXT
#
# #
# Defaults for role redis
#
REDIS_PASSWORD:
REDIS_BIND_IP: 127.0.0.1
REDIS_ENABLE_PROTECTED_MODE: "no"
REDIS_PERSISTENCE_DIR: /var/lib/redis
REDIS_MEMORY_LIMIT: 512mb
REDIS_MAX_MEMORY_POLICY: allkeys-lru
#
# vars are namespace with the module name.
#
redis_role_name: redis

redis_user: redis
redis_group: redis

#
# OS packages
#

# packages.redis.io does not publish Redis 7.x for Ubuntu 26.04 (resolute),
# so those hosts install the noble (24.04) build.
redis_distribution_release_overrides:
  resolute: noble
REDIS_DISTRIBUTION_RELEASE: "{{ redis_distribution_release_overrides[ansible_distribution_release] | default(ansible_distribution_release) }}"

REDIS_GPG_KEY_URL: https://packages.redis.io/gpg
REDIS_KEYRING_PATH: /etc/apt/keyrings/redis.asc
REDIS_REPO: deb [signed-by={{ REDIS_KEYRING_PATH }}] https://packages.redis.io/deb {{ REDIS_DISTRIBUTION_RELEASE }} main
REDIS_VERSION: 6:7.4.5-1rl1~{{ REDIS_DISTRIBUTION_RELEASE }}1

redis_debian_pkgs:
  - redis-tools={{ REDIS_VERSION }}
  - redis-server={{ REDIS_VERSION }}

redis_redhat_pkgs: []
