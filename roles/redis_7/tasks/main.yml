# Example play:
#
#

- name: Ensure dependencies are installed.
  ansible.builtin.apt:
    name:
      - gnupg2
    state: present
    update_cache: true

# apt-key is not available on Ubuntu 26.04, so the key goes to a keyring
# referenced with signed-by in the repo entry.
- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: "{{ REDIS_KEYRING_PATH | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - install
    - install:app-requirements

- name: Add the redis repo signing key
  ansible.builtin.get_url:
    url: "{{ REDIS_GPG_KEY_URL }}"
    dest: "{{ REDIS_KEYRING_PATH }}"
    owner: root
    group: root
    mode: "0644"
  retries: 3
  register: add_redis_signing_key
  until: add_redis_signing_key is succeeded
  tags:
    - install
    - install:app-requirements

# Hosts provisioned before the keyring change have the same repo without
# signed-by. apt refuses to work if both entries exist, so remove the old one.
- name: Remove the legacy redis repo entry
  ansible.builtin.apt_repository:
    repo: deb https://packages.redis.io/deb {{ REDIS_DISTRIBUTION_RELEASE }} main
    state: absent
    update_cache: false
  tags:
    - install
    - install:app-requirements

- name: Add the redis repo to the sources list
  ansible.builtin.apt_repository:
    repo: "{{ REDIS_REPO }}"
    state: present
  tags:
    - install
    - install:app-requirements

- name: Install redis packages
  ansible.builtin.apt:
    name: "{{ redis_debian_pkgs }}"
    install_recommends: true
    state: present
    update_cache: true
  notify:
    - Reload redis

- name: Pin redis package version
  loop: "{{ redis_debian_pkgs }}"
  ansible.builtin.dpkg_selections:
    # Dpkg selection just wants the package name, not the package and version
    # This turns "redis=6:6.2.6-3rl1~focal1" into just "redis"
    name: "{{ item.split('=')[0] }}"
    selection: hold

- name: Update redis configuration
  ansible.builtin.template:
    src: etc/redis/redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: root
    group: "{{ redis_group }}"
    mode: "0640"
  notify:
    - Reload redis
