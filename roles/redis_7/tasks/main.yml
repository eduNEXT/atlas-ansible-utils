#
#
# Example play:
#
#

- name: Ensure dependencies are installed.
  ansible.builtin.apt:
    name:
      - gnupg2
      - python3-debian
    state: present
    update_cache: true

- name: Remove the legacy redis repo file
  ansible.builtin.file:
    path: "{{ redis_legacy_repo_file }}"
    state: absent
  tags:
    - install
    - install:app-requirements

- name: Add the redis repository
  ansible.builtin.deb822_repository:
    name: redis
    types: deb
    uris: "{{ REDIS_REPO_URI }}"
    suites: "{{ REDIS_REPO_SUITE }}"
    components: "{{ REDIS_REPO_COMPONENTS }}"
    signed_by: "{{ REDIS_GPG_KEY_URL }}"
  tags:
    - install
    - install:app-requirements

- name: Install redis packages
  ansible.builtin.apt:
    name: "{{ redis_debian_pkgs }}"
    install_recommends: true
    state: present
    update_cache: true
  notify:
    - Reload redis

- name: Pin redis package version
  loop: "{{ redis_debian_pkgs }}"
  ansible.builtin.dpkg_selections:
    # Dpkg selection just wants the package name, not the package and version
    # This turns "redis=6:6.2.6-3rl1~focal1" into just "redis"
    name: "{{ item.split('=')[0] }}"
    selection: hold

- name: Update redis configuration
  ansible.builtin.template:
    src: etc/redis/redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: root
    group: "{{ redis_group }}"
    mode: "0640"
  notify:
    - Reload redis
