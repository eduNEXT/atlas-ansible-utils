---
# Role: mount_ebs
#
# Mounts and formats disk devices to a target directory.
#
# The role performs some sanity checks, ensuring the filesystem and mount point
# of devices didn't change between invocations. This guards against device name
# changes that might happen in subsequent instance starts.
#
# The role can also resolve symlinks such as /dev/disk/by-id/ paths that can
# map an EBS volume by id directly to the correct device consistently

- name: Validate volume definitions
  ansible.builtin.assert:
    that:
      - item.device is defined
      - item.mount is defined
      - item.options is defined
      - item.fstype is defined
      - item.size is defined
    fail_msg: "Each volume requires device, mount, options, fstype, and size: {{ item }}"
  loop: "{{ volumes }}"
  loop_control:
    label: "{{ item.device | default('<undefined>') }}"
  tags: [always, mount_ebs, validate]

# Resolve symlinks such as /dev/disk/by-id to the kernel device path.
# Resolved symlink targets stored in mount_ebs_device_stats.results[*].stat.lnk_source.
- name: Resolve device symlinks
  ansible.builtin.stat:
    path: "{{ item.device }}"
    follow: false
  register: mount_ebs_device_stats
  loop: "{{ volumes }}"
  loop_control:
    label: "{{ item.device | default('<undefined>') }}"
  tags: [always, mount_ebs, validate]

- name: Verify volume devices and sizes
  ansible.builtin.assert:
    that:
      - device_path | basename in ansible_facts.devices
      - ansible_facts.devices[device_path | basename].size == item.item.size
    fail_msg: >-
      {{ device_path }} has size
      {{ ansible_facts.devices[device_path | basename].size | default('unknown') }};
      expected {{ item.item.size }}. Rebooting may correct device ordering.
  loop: "{{ mount_ebs_device_stats.results }}"
  loop_control:
    label: "{{ item.item.device }}"
  vars:
    device_path: "{{ item.stat.lnk_source | default(item.item.device) }}"
  tags: [always, mount_ebs, validate]

- name: Check whether mounted volumes can be changed
  ansible.builtin.assert:
    that:
      - UNMOUNT_DISKS | bool or current_mount.mount is not defined or current_mount.mount == item.item.mount
      - UNMOUNT_DISKS | bool or current_mount.fstype is not defined or current_mount.fstype == item.item.fstype
    fail_msg: >-
      {{ device_path }} is mounted at {{ current_mount.mount | default('an unknown path') }}
      with {{ current_mount.fstype | default('an unknown filesystem') }}.
      Set UNMOUNT_DISKS=true to change it.
  loop: "{{ mount_ebs_device_stats.results }}"
  loop_control:
    label: "{{ item.item.device }}"
  vars:
    device_path: "{{ item.stat.lnk_source | default(item.item.device) }}"
    current_mount: >-
      {{ ansible_facts.mounts | selectattr('device', 'equalto', device_path)
      | list | first | default({}) }}
  tags: [always, mount_ebs, validate]

- name: Unmount volumes with configuration changes
  ansible.posix.mount:
    name: "{{ current_mount.mount }}"
    fstype: "{{ current_mount.fstype }}"
    state: absent
  loop: "{{ mount_ebs_device_stats.results }}"
  loop_control:
    label: "{{ item.item.device }}"
  vars:
    device_path: "{{ item.stat.lnk_source | default(item.item.device) }}"
    current_mount: >-
      {{ ansible_facts.mounts | selectattr('device', 'equalto', device_path)
      | list | first | default({}) }}
  when:
    - UNMOUNT_DISKS | bool
    - current_mount.mount is defined
    - current_mount.mount != item.item.mount or current_mount.fstype != item.item.fstype
  tags: [mount_ebs, prepare]

- name: Ensure volume filesystems
  community.general.filesystem:
    dev: "{{ item.stat.lnk_source | default(item.item.device) }}"
    fstype: "{{ item.item.fstype }}"
    force: "{{ FORCE_REFORMAT_DISKS | bool }}"
  loop: "{{ mount_ebs_device_stats.results }}"
  loop_control:
    label: "{{ item.item.device }}"
  tags: [mount_ebs, prepare]

- name: Refresh facts after filesystem creation
  ansible.builtin.setup:
  when: mount_ebs_device_stats.results | length > 0
  tags: [mount_ebs, prepare, mount]

- name: Mount volumes by UUID
  ansible.posix.mount:
    name: "{{ item.item.mount }}"
    src: UUID={{ ansible_facts.devices[device_path | basename].links.uuids[0] }}
    state: mounted
    fstype: "{{ item.item.fstype }}"
    opts: "{{ item.item.options }}"
  loop: "{{ mount_ebs_device_stats.results }}"
  loop_control:
    label: "{{ item.item.device }}"
  vars:
    device_path: "{{ item.stat.lnk_source | default(item.item.device) }}"
  tags: [mount_ebs, mount]
