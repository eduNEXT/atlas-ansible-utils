---
driver:
  name: docker
platforms:
  - name: clickhouse-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - clickhouse_servers
  - name: clickhouse-ubuntu2604
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - clickhouse_servers
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        CLICKHOUSE_DEFAULT_USER_NAME: molecule_admin
        CLICKHOUSE_DEFAULT_USER_PASSWORD: password
        CLICKHOUSE_TEXT_LOG_LEVEL: warning
        CLICKHOUSE_LOG_RETENTION_DAYS: 30
        CLICKHOUSE_LOG_QUERIES_MIN_DURATION_MS: 1000
        CLICKHOUSE_SERVER_CONFIG_OVERRIDE: |
          <max_concurrent_queries>1000</max_concurrent_queries>
        CLICKHOUSE_USERS:
          - name: molecule_user
            password: password
            role: molecule_reader
            permissions:
              - object: system.tables
                privs:
                  SELECT: true
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible
