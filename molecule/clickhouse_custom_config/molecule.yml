---
driver:
  name: docker
platforms:
  - name: clickhouse-custom-config-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - clickhouse_servers
provisioner:
  name: ansible
  inventory:
    all:
      CLICKHOUSE_DEFAULT_USER_PASSWORD: "changeme123"
      CLICKHOUSE_CUSTOM_CONFIGS:
        max_concurrent_queries.xml: |
          <clickhouse>
            <max_concurrent_queries>200</max_concurrent_queries>
          </clickhouse>
        custom_log_level.xml: |
          <clickhouse>
            <logger>
              <level>information</level>
            </logger>
          </clickhouse>
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible