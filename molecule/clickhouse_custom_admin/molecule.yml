---
driver:
  name: docker
platforms:
  - name: clickhouse-custom-admin-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /run
      - /tmp
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - clickhouse_servers
provisioner:
  name: ansible
  inventory:
    all:
      CLICKHOUSE_DEFAULT_USER_PASSWORD: "changeme123"
      CLICKHOUSE_ADMIN_USER: "custom_admin"
      CLICKHOUSE_ADMIN_PASSWORD: "adminpassword123"
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible