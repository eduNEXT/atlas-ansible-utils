---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    ch_user: "{{ lookup('env', 'CLICKHOUSE_ADMIN_USER') | default('default') }}"
    ch_pass: "{{ lookup('env', 'CLICKHOUSE_ADMIN_PASSWORD') | default('changeme123') }}"
  tasks:
    - name: Verify ClickHouse HTTP endpoint
      ansible.builtin.uri:
        url: "http://localhost:8123/"
        status_code: 200
        timeout: 5
        return_content: yes

    - name: Verify ClickHouse native connection
      ansible.builtin.command: >
        clickhouse-client --user "{{ ch_user }}" --password="{{ ch_pass }}" --query "SELECT 1"
      register: ch_connect
      changed_when: false
      failed_when: false
      ignore_errors: true

    - name: Assert connection successful
      ansible.builtin.assert:
        that:
          - ch_connect.rc == 0
          - ch_connect.stdout | trim == '1'
        fail_msg: "ClickHouse connection failed: {{ ch_connect.stderr }}"

    - name: Verify default user exists (when no custom admin)
      ansible.builtin.command: >
        clickhouse-client --user "{{ ch_user }}" --password="{{ ch_pass }}" --query "SELECT name FROM system.users WHERE name = 'default'"
      register: ch_default_user
      changed_when: false
      when: ch_user == 'default'

    - name: Assert default user exists
      ansible.builtin.assert:
        that:
          - ch_default_user.stdout | trim == 'default'
        fail_msg: "Default user not found"
      when: ch_user == 'default'

    - name: Verify custom admin user exists
      ansible.builtin.command: >
        clickhouse-client --user "{{ ch_user }}" --password="{{ ch_pass }}" --query "SELECT name FROM system.users WHERE name = 'custom_admin'"
      register: ch_custom_admin
      changed_when: false
      when: ch_user != 'default'

    - name: Assert custom admin user exists
      ansible.builtin.assert:
        that:
          - ch_custom_admin.stdout | trim == 'custom_admin'
        fail_msg: "Custom admin user not found"
      when: ch_user != 'default'

    - name: Verify default user is removed (when custom admin)
      ansible.builtin.command: >
        clickhouse-client --user "{{ ch_user }}" --password="{{ ch_pass }}" --query "SELECT name FROM system.users WHERE name = 'default'"
      register: ch_default_removed
      changed_when: false
      when: ch_user != 'default'

    - name: Assert default user is removed
      ansible.builtin.assert:
        that:
          - ch_default_removed.stdout | trim == ''
        fail_msg: "Default user should be removed when custom admin is used"
      when: ch_user != 'default'

    - name: Verify configured users exist
      ansible.builtin.command: >
        clickhouse-client --user "{{ ch_user }}" --password="{{ ch_pass }}" --query "SELECT name FROM system.users WHERE name IN ('prod', 'stage')"
      register: ch_app_users
      changed_when: false

    - name: Assert application users exist
      ansible.builtin.assert:
        that:
          - ch_app_users.stdout | trim != ''
        fail_msg: "Application users (prod, stage) not found"

    - name: Verify backup disk configured
      ansible.builtin.command: >
        clickhouse-client --user "{{ ch_user }}" --password="{{ ch_pass }}" --query "SELECT name FROM system.disks WHERE name = 'backups'"
      register: ch_backup_disk
      changed_when: false

    - name: Assert backup disk exists
      ansible.builtin.assert:
        that:
          - ch_backup_disk.stdout | trim == 'backups'
        fail_msg: "Backup disk 'backups' not configured"

    - name: Verify system logs configuration
      ansible.builtin.command: >
        clickhouse-client --user "{{ ch_user }}" --password="{{ ch_pass }}" --query "SELECT name FROM system.tables WHERE database = 'system' AND name LIKE '%_log'"
      register: ch_system_logs
      changed_when: false

    - name: Debug system logs
      ansible.builtin.debug:
        var: ch_system_logs.stdout